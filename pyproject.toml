[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rexlet"
version = "0.1.0"
description = "A personal data hub for turning fragmented everyday data into reliable, structured, and useful information."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
